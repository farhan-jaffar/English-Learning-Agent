$kind: http-request
description: Lists all speech practice recordings created by the authenticated learner.
url: "{{baseUrl}}/api/recordings/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('User recordings array returned', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');
      });
    language: text/javascript
order: 2000
