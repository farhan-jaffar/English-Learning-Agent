$kind: http-request
description: Retrieves recording status and speech analysis results (WPM, CEFR, grammar, vocabulary).
url: "{{baseUrl}}/api/recordings/{{recordingId}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Recording details match environment recordingId', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.id).to.eql(pm.environment.get('recordingId'));
          pm.expect(jsonData).to.have.property('status');
      });
    language: text/javascript
order: 3000
