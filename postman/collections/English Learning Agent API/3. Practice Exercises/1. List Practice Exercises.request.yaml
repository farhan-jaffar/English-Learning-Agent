$kind: http-request
description: Returns full list of available practice exercises with topic tags and target languages.
url: "{{baseUrl}}/api/exercises/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Exercises returned as list and exerciseId stored', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');
          if (jsonData.length > 0) {
              pm.environment.set('exerciseId', jsonData[0].id);
          }
      });
    language: text/javascript
order: 1000
