$kind: http-request
description: Unenrolls the user from this language profile.
url: "{{baseUrl}}/api/auth/languages/{{enrolledLanguageId}}/"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 204 No Content', function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 6000
